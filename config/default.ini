# recreation://config/default.ini: what recreation changes on every machine,
# over rx's rxe://config/<tier>.ini. A recreation://config/<tier>.ini applies
# after this one (rx docs/CONFIG.md). Unlisted keys keep the tier's value.

[options]
# Read when the window opens, before any tier is known, which is why it sits
# here and not in steamdeck.ini. The HUD drives its pointer from touch itself
# (runtime/ui/touch_pointer.h), so a synthesized cursor only adds a thumb on
# the panel dragging mouse look.
touch.emits_mouse = false
