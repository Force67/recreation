# Steam Deck. Sits on top of rx's steamdeck render tier
# (engine/render/presets/steamdeck.ini), which already tunes the GPU side: FSR3
# performance, hybrid RT shadows + AO + DDGI, RT reflections off. What is left
# here is what rx cannot know: the panel, the game's streaming load on four Zen2
# cores, and how a handheld should treat the touchscreen.
#
# Load with --profile steamdeck. Environment variables still win over every
# value here, so a one-off RX_* override needs no edit.

[engine]
preset = steamdeck
# Grass is the single largest exterior cost in Bethesda worldspaces and the
# 8-CU GPU feels it before anything else does.
grass_density = 0.6

[options]
# Native panel. Also what gamescope hands a fullscreen client on the Deck.
win.width = 1280
win.height = 800

# A thumb resting on the panel would otherwise emit synthetic mouse motion and
# drag mouse look. The engine still delivers real touch through Window::touch().
touch.emits_mouse = 0

# NOT set here: ui.scale, though it is the knob this needs.
#
# The panel is 1280x800 across 7 inches, so ~216 PPI and 1mm is only 8.5px.
# Measured against their declared geometry, 59 of 62 interactive widgets come
# out under 7mm, i.e. smaller than a fingertip, so the screens genuinely are
# too small to drive by touch.
#
# But scaling them up does not currently work: main_menu.ugui does not reflow.
# At 1.25x PROFILE is clipped and QUIT is off-screen; at 1.5x SETTINGS is
# clipped too and the account row lands on top of MODS. An unreachable Quit is
# worse than a small one, so this stays at the default 1.0 until the screens
# use a flow layout for the nav column and stop absolutely positioning the
# account row. The knob itself works (RECREATION_UI_SCALE=1.25 to see it).

# NOT set here: drs / drs.target.ms / drs.min.scale. Dynamic resolution is inert
# whenever a vendor upscaler owns the render ratio (renderer.cc: drs_active
# excludes aa_mode == kUpscaler), and the steamdeck tier runs FSR3 Performance,
# so setting them would look like frame-rate protection while doing nothing.
# FSR3's quality level is the resolution knob on this tier; drop to
# upscaler_quality in [render] if 30 fps needs defending.

# NOT set here: tex.budget.mb. A negative budget means device_local_bytes / 2,
# which adapts to the Deck's actual VRAM carve-out (1 GB by default, 4 GB if it
# has been raised in BIOS). A fixed 1536 would overcommit a stock 1 GB Deck by
# 3x, i.e. be strictly worse than the default it replaced. Set it only after
# measuring on the device.

# Both LOD chains on. The Bethesda distant .btr/.bto meshes are what keep the
# exterior draw count inside a handheld's budget.
distant.lod = 1
distance.lod = 1

# Four cores, so the streaming time-slice has to be tighter than the desktop
# default (4 ms) or a cell crossing eats the frame.
stream.budget_ms = 2

[render]
# Deltas on top of the steamdeck tier, applied after it resolves. Shadow
# distance is a game-content call: Bethesda exteriors put almost nothing that
# casts a readable shadow past this range, so the cascades are wasted there.
shadow_distance = 100.0
vsync = true
